<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Signalements de rats - Paris 13e</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Signalements de rats – Paris 13e</h1>
    <p>Données issues de l'Open Data de la Ville de Paris</p>
</header>

<div class="container">

    <!-- SECTION SIGNALER -->
    <section class="report">
        <h2>Faire un signalement</h2>

        <form id="reportForm" class="report-form">
            <label>
                Adresse
                <input id="address" type="text" placeholder="12 rue X, 75013 Paris" required />
            </label>

            <label>
                Date
                <input id="date" type="date" required />
            </label>

            <label>
                Commentaire
                <textarea id="comment" rows="3" required></textarea>
            </label>

            <button type="submit">Placer le point</button>
            <span id="formStatus" class="status"></span>
        </form>

        <div id="myMap" class="my-map"></div>

        <h3>Mes signalements</h3>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Adresse</th>
                        <th>Commentaire</th>
                        <th>Lat</th>
                        <th>Lon</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="myReportsBody"></tbody>
            </table>
        </div>
    </section>

    <!-- CARTE OPEN DATA -->
    <h2>Signalements officiels (Open Data)</h2>

    <div class="map-container">
        <iframe 
            src="https://opendata.paris.fr/explore/embed/dataset/dans-ma-rue/map/?refine.code_postal=75013&q=rat&basemap=jawg.dark&location=13,48.82399,2.36275&static=false&datasetcard=false&scrollWheelZoom=true"
            allowfullscreen>
        </iframe>
    </div>

    <div class="table-container">
        <h2>Détail des signalements officiels</h2>
        <iframe 
            src="https://opendata.paris.fr/explore/embed/dataset/dans-ma-rue/table/?refine.arrondissement=13&q=rat&static=false&datasetcard=false"
            frameborder="0">
        </iframe>
    </div>

</div>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAlkjNfp4WSYN7kUkVdUAEQgZCKlFHnGUc",
    authDomain: "rats-f5b11.firebaseapp.com",
    projectId: "rats-f5b11",
    storageBucket: "rats-f5b11.appspot.com",
    messagingSenderId: "1040343320667",
    appId: "1:1040343320667:web:b391281c035721ce7b577e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // on expose aussi signInAnonymously pour que app.js puisse AWAIT
  window.__FIREBASE__ = { db, auth, signInAnonymously };
</script>


<script src="app.js"></script>

</body>
</html>
